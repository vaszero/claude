<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="only light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강사 화면 · CS 플레이</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/host.css">
</head>
<body class="host">
  <header class="topbar">
    <div class="brand" id="brand">병원 CS 플레이</div>
    <div class="phase-name" id="phaseName"></div>
    <div class="mini-qr hidden" id="miniQr" title="클릭하면 크게 보기 (Q)"><img alt="입장 QR"><span></span></div>
    <div class="count" id="conn"><span class="dot"></span><span id="countText">0명</span></div>
  </header>
  <main id="stage"></main>
  <div id="bigQr" class="big-qr hidden" title="클릭하면 닫힙니다"><div class="big-qr-card"><p>휴대폰 카메라로 찍어 입장하세요</p><img alt="입장 QR 코드"><div class="url"></div><small>클릭하거나 Q 키를 누르면 닫힙니다</small></div></div>
  <nav id="dock"></nav>
  <script src="/qrcode.js"></script>
  <script src="/ws-client.js"></script>
  <script src="/host.js"></script>
</body>
</html>
